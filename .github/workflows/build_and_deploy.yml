name: Deploy Snowpark Apps

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install snowflake-cli-labs
          pip install -r requirements.txt

      # 🔑 REQUIRED STEP — THIS FIXES "Connection default is not configured"
      - name: Configure SnowCLI connection
        run: |
          snow connection add default \
            --account "${SNOWFLAKE_ACCOUNT}" \
            --username "${SNOWFLAKE_USER}" \
            --password "${SNOWFLAKE_PASSWORD}" \
            --rolename "${SNOWFLAKE_ROLE}" \
            --warehouse "${SNOWFLAKE_WAREHOUSE}" \
            --dbname "${SNOWFLAKE_DATABASE}" \
            --schema "${SNOWFLAKE_SCHEMA}"
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT_DEV }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER_DEV }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD_DEV }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE_DEV }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE_DEV }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE_DEV }}
          SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA_DEV }}

      - name: Build & Deploy Snowpark
        working-directory: first_snowpark_project
        run: |
          python deploy_snowpark_app.py $GITHUB_WORKSPACE/first_snowpark_project
