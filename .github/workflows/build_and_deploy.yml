name: Deploy Snowpark Apps

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: chittaranjan121/snowparkdev
          ref: dev

      # 2️⃣ Setup Python
      - name: Setup Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      # 3️⃣ Install dependencies
      - name: Install Python packages
        run: pip install -r requirements.txt

      # 4️⃣ ✅ ADD THIS STEP — Configure SnowCLI connection
      - name: Configure Snowflake CLI connection
        run: |
          snow connection add  \
            --connection-name default \
            --account "$SNOWFLAKE_ACCOUNT" \
            --username "$SNOWFLAKE_USER" \
            --password "$SNOWFLAKE_PASSWORD" \
            --rolename "$SNOWFLAKE_ROLE" \
            --warehouse "$SNOWFLAKE_WAREHOUSE" \
            --dbname "$SNOWFLAKE_DATABASE" \
            --schema "$SNOWFLAKE_SCHEMA"
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT_DEV }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER_DEV }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD_DEV }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE_DEV }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE_DEV }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE_DEV }}
          SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA_DEV }}

      # 5️⃣ Deploy Snowpark app
      - name: Deploy Snowpark apps
        working-directory: first_snowpark_project
        run: python deploy_snowpark_app.py $GITHUB_WORKSPACE/first_snowpark_project
